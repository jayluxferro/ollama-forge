[project]
name = "ollama-forge"
version = "1.0.1"
description = "Create, retrain, ablate, and convert models for local Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.25",
  "datasets>=2.14",
  "gguf>=0.10.0",
  "huggingface_hub>=0.20.0",
  "mlx>=0.10.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "optuna>=3.0",
  "pandas>=2.0",
  "plotly>=5.18",
  "protobuf>=3.20",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "requests>=2.28",
  "safetensors>=0.4.0",
  "streamlit>=1.28",
  "torch>=2.0",
  "transformers>=5.2.0",
  "triton>=2.1.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "unsloth",
  "hf-transfer>=0.1.0",      # fast Hugging Face downloads (auto-enabled)
]

[project.scripts]
ollama-forge = "ollama_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_forge"]

[dependency-groups]
dev = ["pytest>=7", "pytest-cov>=4.0", "ruff>=0.4", "twine>=6.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Ollama template strings contain fixed protocol text that cannot be wrapped
"src/ollama_forge/model_family.py" = ["E501"]
